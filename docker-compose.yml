services:
  api:
    image: ghcr.io/kralluz/sismapifgoianoback:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true

    container_name: sismapifgoianoback-api

    environment:
      - NODE_ENV=production
      - PORT=3020
      - API_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      mode: replicated
      replicas: 1

      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

      restart_policy:
        condition: any

      update_config:
        parallelism: 1
        delay: 10s

      rollback_config:
        parallelism: 1
        delay: 10s

      endpoint_mode: vip

    ports:
      - "3020:3020"